services:
  payload:
    image: node:20-alpine
    ports:
      - '3000:3000'
    volumes:
      - .:/home/node/app
      - node_modules:/home/node/app/node_modules
    working_dir: /home/node/app/
    command: sh -c "npm install && npm run dev"
    depends_on:
      - postgres
    env_file:
      - .env.local
    environment:
      POSTGRES_URL: postgresql://postgres:postgres@postgres:5432/memoryvault

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    ports:
      - '5432:5432'
    environment:
      POSTGRES_DB: memoryvault
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d memoryvault']
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - memoryvault_dev_pgdata:/var/lib/postgresql/data

volumes:
  memoryvault_dev_pgdata:
  node_modules:
