name: Bug report
description: Something isn't working as expected in MemoryVault Community Edition
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report a bug! Please fill out the sections below.

  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: A clear description of the bug.
      placeholder: Tell us what you saw
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: What did you expect to happen?
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Go to '...'
        2. Click on '...'
        3. See error
    validations:
      required: true

  - type: dropdown
    id: setup
    attributes:
      label: How are you running MemoryVault?
      options:
        - Docker Compose (this repo's docker-compose.yml)
        - Manual setup (npm run dev)
        - Custom deployment
    validations:
      required: true

  - type: input
    id: postgres
    attributes:
      label: Postgres provider
      placeholder: e.g. local Docker, Neon, Supabase, RDS
    validations:
      required: false

  - type: input
    id: storage
    attributes:
      label: S3-compatible storage provider
      placeholder: e.g. Cloudflare R2, MinIO, AWS S3
    validations:
      required: false

  - type: textarea
    id: logs
    attributes:
      label: Relevant logs
      description: Paste any relevant server or browser console logs. This will be automatically formatted as code.
      render: shell
    validations:
      required: false
